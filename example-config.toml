# Calcite Calendar Configuration
# Place at: ~/.config/calcite/config.toml

# =============================================================================
# CATEGORIES (up to 9)
# =============================================================================
# Define event categories with names and colors
# Access by number (1-9) when creating events
#
# Available colors: Black, Red, Green, Yellow, Blue, Magenta, Cyan, Gray, White,
#                   DarkGray, LightRed, LightGreen, LightYellow, LightBlue, 
#                   LightMagenta, LightCyan, Orange, Brown, Teal

[[categories]]
name = "Work"
color = "Blue"

[[categories]]
name = "Personal"
color = "Green"

[[categories]]
name = "Health"
color = "Red"

[[categories]]
name = "Social"
color = "Magenta"

[[categories]]
name = "Finance"
color = "Yellow"

[[categories]]
name = "Education"
color = "Cyan"

[[categories]]
name = "Travel"
color = "LightBlue"

[[categories]]
name = "Shopping"
color = "LightGreen"

[[categories]]
name = "Other"
color = "Gray"

# =============================================================================
# ICS CALENDAR IMPORTS (optional)
# =============================================================================
# Import external calendars from ICS/iCal URLs
# Events are read-only and assigned to a category
# Set "export = false" to exclude a calendar from .ics exports (default is true)

# [[ics_calendars]]
# url = "https://calendar.google.com/calendar/ical/YOUR_CALENDAR_ID/public/basic.ics"
# category = 1  # Assigns to category 1 (Work)
# export = true # Include in exports (default: true, can be omitted)

# [[ics_calendars]]
# url = "https://calendar.google.com/calendar/ical/ANOTHER_CALENDAR/public/basic.ics"
# category = 2  # Assigns to category 2 (Personal)
# export = false # Exclude from exports

# =============================================================================
# YEAR FILTERING (optional)
# =============================================================================
# Filter imported ICS events by year range

# min_year = 2024
# max_year = 2030

# =============================================================================
# EXPORT CONFIGURATION (optional)
# =============================================================================
# Configure ICS export (happens when you press 'E')

# Full path to export file (default: ~/.config/calcite/calendar.ics)
# Supports ~/ expansion, relative paths (to config dir), or absolute paths
# Use chrono format specifiers for timestamps: %Y %m %d %H %M %S %B %b %A %a
# export_path = "~/gdrive/calcite.ics"
# export_path = "~/Documents/calendar_%Y%m%d.ics"


